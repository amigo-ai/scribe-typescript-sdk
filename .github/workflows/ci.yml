name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails the PR if src/generated/openapi.ts is stale w.r.t. the vendored
      # spec (openapi/scribe.json). Refresh with `npm run openapi:sync` then
      # `npm run generate:schema` and commit the result.
      - name: Verify generated API types are committed
        run: |
          npm run generate:schema
          git diff --exit-code -- src/generated/openapi.ts

      - name: Format check
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Build (esbuild ESM + tsc types)
        run: npm run build

      - name: Run unit tests
        run: npm test -- --reporter=dot

  # E2E tests hit a real Scribe endpoint and require credentials. They are
  # gated to run locally only for now (they self-skip without SCRIBE_E2E_*
  # env vars — see tests/e2e/). This job is intentionally NOT enabled in CI.
  #
  # FOLLOW-UP (tracked): promote E2E to CI once a stable staging Scribe
  # endpoint + a scoped `scribe:sessions:write` service token are available.
  # Provision repo secrets SCRIBE_E2E_BASE_URL / SCRIBE_E2E_TOKEN /
  # SCRIBE_E2E_WORKSPACE_ID, then set `if: true` below and add:
  #   - env: { SCRIBE_E2E_ENABLED: 'true', SCRIBE_E2E_BASE_URL: ..., ... }
  #     run: npm run test:e2e
  e2e:
    runs-on: ubuntu-latest
    needs: build-lint-test
    if: false # DISABLED until staging is stable — see comment above.
    steps:
      - name: Placeholder
        run: echo "E2E job is a stub; enable once staging Scribe endpoint is ready."
