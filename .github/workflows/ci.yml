name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails the PR if src/generated/openapi.ts is stale w.r.t. the vendored
      # spec (openapi/scribe.json). Refresh with `npm run openapi:sync` then
      # `npm run generate:schema` and commit the result.
      - name: Verify generated API types are committed
        run: |
          npm run generate:schema
          git diff --exit-code -- src/generated/openapi.ts

      - name: Format check
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Build (esbuild ESM + tsc types)
        run: npm run build

      - name: Validate package (publint + attw + npm pack dry-run)
        run: npm run validate

      - name: Run unit tests
        run: npm test -- --reporter=dot

  # E2E tests hit the REAL staging Scribe stack (identity /token mints →
  # create/allocate → WS stream). They run the full superscribe-web in-person
  # path via the SDK, feeding synthetic PCM16 (headless CI has no mic).
  #
  # Gating: runs on pushes to main and on same-repo PRs (which can read repo
  # secrets); fork / external PRs are skipped here because they have no secrets.
  # As belt-and-suspenders the tests ALSO self-skip when the SCRIBE_E2E_* /
  # SCRIBE_M2M_* env is absent, so the job is a no-op rather than a failure if a
  # secret is ever missing. See tests/e2e/README.md.
  e2e:
    runs-on: ubuntu-latest
    needs: build-lint-test
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests (staging)
        env:
          # Non-sensitive hostnames come from repository *variables*, each with a
          # staging default so the correct host is used even if the variable is
          # unset/misconfigured (overridable per environment). NOTE: the identity
          # (OTP/token) host is `api-staging`, NOT `identity-staging`.
          SCRIBE_E2E_BASE_URL: ${{ vars.SCRIBE_E2E_BASE_URL || 'https://scribe-staging.platform.amigo.ai' }}
          SCRIBE_E2E_IDENTITY_BASE_URL: ${{ vars.SCRIBE_E2E_IDENTITY_BASE_URL || 'https://api-staging.platform.amigo.ai' }}
          # M2M-suite credentials (secrets).
          SCRIBE_E2E_WORKSPACE_ID: ${{ secrets.SCRIBE_E2E_WORKSPACE_ID }}
          SCRIBE_E2E_PROVIDER_EMAIL: ${{ secrets.SCRIBE_E2E_PROVIDER_EMAIL }}
          SCRIBE_M2M_CLIENT_ID: ${{ secrets.SCRIBE_M2M_CLIENT_ID }}
          SCRIBE_M2M_CLIENT_SECRET: ${{ secrets.SCRIBE_M2M_CLIENT_SECRET }}
          # GA post-visit-mutation suite: a short-lived provider JWT (OTP-minted,
          # out-of-band). When absent the token suite self-skips cleanly.
          SCRIBE_E2E_TOKEN: ${{ secrets.SCRIBE_E2E_TOKEN }}
        # verbose so the log names each suite that actually ran (vs. skipped).
        run: npm run test:e2e -- --reporter=verbose
